<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Donat</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .package { padding: 10px; margin: 5px; border: 1px solid #ccc; cursor: pointer; display: inline-block; }
        .package.selected { border-color: blue; background-color: #e6f0ff; }
        #paymentBox, #checkSection { display: none; margin-top: 15px; }
        .timer { color: red; font-weight: bold; font-size: 16px; }
        .confirm-btn {
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
        }
        .confirm-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

    <!-- Misol uchun elementlar -->
    <h2>Diamond paketini tanlang</h2>
    <div class="package" onclick="selectPackage(110, 10000, this)">110 Diamond - 10 000 so'm</div>
    <div class="package" onclick="selectPackage(1166, 99999, this)">1166 Diamond - 99 999 so'm</div>

    <br><br>
    <label>Player ID:</label>
    <input type="text" id="playerId" placeholder="ID kiriting">
    <br><br>
    
    <button onclick="order()">Donat qilish</button>

    <!-- To'lov oynasi (tugmalar) -->
    <div id="paymentBox">
        <h3>To'lov usulini tanlang</h3>
        <button onclick="pay('HUMO')">HUMO</button>
        <button onclick="pay('UZCARD')">UZCARD</button>
    </div>

    <!-- Chek yuborish / To'lov qildim tugmasi chiqadigan joy -->
    <div id="checkSection">
        <button class="confirm-btn" onclick="confirmPayment()">✅ To‘lov qildim</button>
    </div>

    <!-- Natijalar chiqadigan joy -->
    <div id="result" style="margin-top: 20px; font-weight: bold;"></div>

<script>
  let selectedPackage = null;
  let selectedPrice = null;
  let timerInterval = null;

  // PAKETNI TANLASH
  function selectPackage(diamonds, price, element) {
    document.querySelectorAll(".package").forEach(function(pkg) {
      pkg.classList.remove("selected");
    });

    element.classList.add("selected");

    selectedPackage = diamonds;
    selectedPrice = price;

    document.getElementById("paymentBox").style.display = "none";
    document.getElementById("checkSection").style.display = "none";

    if (timerInterval) clearInterval(timerInterval);

    document.getElementById("result").innerHTML =
      "💎 " + diamonds +
      " diamond tanlandi<br>" +
      "💰 " + price.toLocaleString() +
      " so'm";
  }

  // DONAT QILISH
  function order() {
    const playerId = document.getElementById("playerId").value.trim();

    // ID tekshirish
    if (playerId === "") {
      document.getElementById("result").innerHTML =
        "❌ Avval Player ID kiriting!";
      return;
    }

    // PAKET tekshirish
    if (selectedPackage === null) {
      document.getElementById("result").innerHTML =
        "❌ Avval diamond paketini tanlang!";
      return;
    }

    // TO'LOV OYNASINI OCHISH
    document.getElementById("paymentBox").style.display = "block";
    document.getElementById("checkSection").style.display = "none";

    if (timerInterval) clearInterval(timerInterval);

    document.getElementById("result").innerHTML =
      "👤 Player ID: " + playerId +
      "<br>" +
      "💎 Diamond: " + selectedPackage +
      "<br>" +
      "💰 Summa: " +
      selectedPrice.toLocaleString() +
      " so'm" +
      "<br><br>" +
      "👇 To‘lov usulini tanlang";
  }

  // HUMO / UZCARD TANLASH + TAYMER
  function pay(method) {
    const playerId = document.getElementById("playerId").value.trim();

    let cardNumber = "";
    if (method === "HUMO") {
      cardNumber = "9860 1601 3593 2558"; // Humo raqamingiz
    } else if (method === "UZCARD") {
      cardNumber = "5614 6835 1437 6425"; // Uzcard raqamingiz
    }

    // "To'lov qildim" tugmasini ko'rsatish
    document.getElementById("checkSection").style.display = "block";

    // 30 daqiqalik taymerni boshlash (30 * 60 sekund)
    let timeLeft = 30 * 60; 

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(function() {
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      
      let timerString = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        document.getElementById("timerDisplay").innerHTML = "Vaqt tugadi!";
        document.getElementById("checkSection").style.display = "none";
      } else {
        let timerElem = document.getElementById("timerDisplay");
        if (timerElem) timerElem.innerHTML = timerString;
        timeLeft--;
      }
    }, 1000);

    document.getElementById("result").innerHTML =
      "✅ " + method + " tanlandi!" +
      "<br><br>" +
      "💳 <b>Karta raqami:</b> <span style='color: green; font-size: 18px;'>" + cardNumber + "</span>" +
      "<br><br>" +
      "⏳ To'lov qilish uchun vaqt: <span id='timerDisplay' class='timer'>30:00</span>" +
      "<br><br>" +
      "👤 Player ID: " + playerId +
      "<br>" +
      "💎 Diamond: " + selectedPackage +
      "<br>" +
      "💰 Summa: " +
      selectedPrice.toLocaleString() +
      " so'm" +
      "<br><br>" +
      "👉 Yuqoridagi kartaga pulni o'tkazing va pastdagi tugmani bosing!";
  }

  // "TO'LOV QILDIM" TUGMASI BOSILGANDA
  function confirmPayment() {
    if (timerInterval) clearInterval(timerInterval); // Taymerni to'xtatish

    document.getElementById("checkSection").style.display = "none";
    document.getElementById("paymentBox").style.display = "none";

    document.getElementById("result").innerHTML =
      "⏳ <b>Iltimos kuting, to‘lov tekshirilmoqda...</b><br><br>" +
      "Adminlar tez orada to'lovni tekshirib tasdiqlashadi!";
  }
</script>

</body>
</html>
